<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InCynq - DJ &amp; Live Performer - Coming Soon (ad mockup)</title>
<style>
  :root{
    --bg:#040f14; --sky:#00B4C8; --text:#ffffff; --muted:#b0c4d0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:#0a1620;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh;
  }
  /* The card = the exact Coming Soon layout from the app.
     Square-ish so it doubles as a feed/ad creative. Edit freely. */
  .card{
    background:var(--bg);
    width:100%;max-width:560px;aspect-ratio:1/1;
    border-radius:24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:48px 36px;
    box-shadow:0 24px 60px rgba(0,0,0,0.45);
    position:relative;overflow:hidden;
  }
  /* soft brand glow */
  .card::before{
    content:"";position:absolute;top:-30%;left:50%;transform:translateX(-50%);
    width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle, rgba(0,180,200,0.18), transparent 70%);
    pointer-events:none;
  }
  .wordmark{
    position:absolute;top:22px;left:0;right:0;text-align:center;
    font-size:15px;font-weight:900;letter-spacing:.5px;color:var(--sky);
  }
  .icon{font-size:56px;margin-bottom:18px;line-height:1;}
  h1{color:var(--text);font-size:30px;font-weight:800;margin:0 0 14px;letter-spacing:.2px;}
  .chip{
    display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;
    color:var(--sky);background:rgba(0,180,200,0.12);
    border:1px solid rgba(0,180,200,0.35);border-radius:20px;padding:5px 16px;margin-bottom:22px;
  }
  p{color:var(--muted);font-size:15px;line-height:1.7;margin:0 auto;max-width:360px;}
  .cta{
    margin-top:30px;display:inline-block;background:var(--sky);color:#fff;
    font-size:15px;font-weight:700;border:none;border-radius:12px;
    padding:13px 40px;cursor:pointer;text-decoration:none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark">InCynq</div>
    <div class="icon">🎧</div>
    <h1>DJ &amp; Live Performer</h1>
    <div class="chip">COMING SOON</div>
    <p>Go live inside InCynq, build your following, and collect tips &mdash; all from your own DJ / performer identity. We are putting the finishing touches on it. Stay tuned!</p>
    <a class="cta" href="#">Get notified</a>
  </div>
</body>
</html>
